org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+UnlockDiagnosticVMOptions -XX:-UseAES -XX:-UseAESIntrinsics -XX:-UseAESCTRIntrinsics -Djdk.tls.disabledAlgorithms=GCM,ChaCha20,Poly1305 -Dhttps.protocols=TLSv1.2
android.overridePathCheck=true
android.useAndroidX=true
# Force TLS 1.2 and disable problematic ciphers to avoid bad_record_mac
systemProp.jdk.tls.client.protocols=TLSv1.2
systemProp.https.protocols=TLSv1.2
systemProp.jdk.tls.disabledAlgorithms=GCM, ChaCha20, Poly1305
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Pin the Gradle daemon to Android Studio's bundled JBR. The system-wide
# java on PATH on this host is a broken 32-bit JRE 8 that cannot reserve a
# 2GB heap and has its own TLS bugs — auto-detection must not land on it.
org.gradle.java.home=F:/Android Studio/jbr
# Gradle 9's Kotlin Build Tools API cannot close its incremental-compile
# cache files on this host (Windows file-handle quirk) — every Kotlin
# plugin module fails with "Could not close incremental caches". Disabling
# Kotlin incrementality avoids that codepath entirely; it costs a slightly
# slower rebuild, not correctness.
kotlin.incremental=false
